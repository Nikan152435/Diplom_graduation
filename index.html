<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кинотеатр</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container__index">
        <header class="header__index">
            <h1 class="header-content">Идём<span class="letter">в</span>кино</h1>
            <button class="btn__index">Войти</button>
            <!-- Добавляем кнопку регистрации -->
            <button class="register-button">Зарегистрироваться</button>
               <!-- Новая кнопка "Большая функциональность" -->
               <button class="big-feature">Нажми меня!</button>
        </header>

        <nav class="menu">
            <ul class="menu-list">      
                <li class="today revers">
                    <p class="text_menu">Сегодня</p>
                </li>
                <li class="menu-list-item">
                    <p class="text_menu">Фильм 1</p>
                </li>
                <li class="menu-list-item">
                    <p class="text_menu">Фильм 2</p>
                </li>
                <li class="menu-list-item">
                    <p class="text_menu">Фильм 3</p>
                </li>
                <li class="menu-list-item">
                    <p class="text_menu">Фильм 4</p>
                </li>
                <li class="menu-list-item">
                    <p class="text_menu">Фильм 5</p>
                </li>
                <li class="menu-list-item">
                    <p class="text_menu">Фильм 6</p>
                </li>
                <li class="arrow_item right">
                    <p class="arrow_text">&gt;</p>
                </li>
            </ul>
        </nav>
        
        <main class="main__index">
            <!-- Основной контент с изображениями -->
        </main>
    </div>

    <script>
        // Обработчик события регистрации
        document.querySelector('.register-button').addEventListener('click', async () => {
            const registrationData = {
                username: prompt('Введите имя пользователя:'),
                password: prompt('Введите пароль:'),
            };
            const response = await fetch('./data/register.json', { // Локальный путь для регистрации
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(registrationData),
            });
            if (response.ok) {
                const data = await response.json();
                console.log('Регистрация успешна:', data);
                alert('Вы успешно зарегистрировались!');
            } else {
                console.error('Ошибка регистрации:', await response.text());
                alert('Ошибка регистрации. Попробуйте снова.');
            }
        });
    </script>

    <script src="./js/data.js"></script>
    <script src="bundle.js" defer></script>
    <script src="./js/client.js" defer></script>
    <script src="./js/seance.js" defer></script>
    <script src="./js/login.js" defer></script>
</body>

</html>
